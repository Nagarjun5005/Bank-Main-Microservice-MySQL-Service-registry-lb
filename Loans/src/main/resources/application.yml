server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource:
    url: jdbc:mysql://localhost:3308/loansdb
    username: root
    password: root

  jpa:
    show-sql: true
  sql:
    init:
      mode: always


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      access : unrestricted

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "loans"
    description: "Nagarjun Microservices Loans Application"
    version: "1.0.0"

build:
  version:
    "7.1"



loans:
  message : "Hello This Message is from loans config --->default"
