server:
  port: 9000
spring:
  application:
    name : "cards"
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource:
    url: jdbc:mysql://localhost:3309/cardsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
      init:
        mode: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone:  http://localhost:8070/eureka/

build:
  version:
    "4.0"



management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access : unrestricted
  info:
    env:
      access : unrestricted

info:
  app:
    name: "accounts"
    description: "Nagarjun Microservices Accounts Application"
    version: "1.0.0"

cardS:
  message: "This Info Is From Cards --->Default  "
  contactDetails:
    name: "Nagarjun - Developer"
    email: "Nagarjun@gmail.com.com"
